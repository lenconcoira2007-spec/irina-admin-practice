
name: README Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-readme:
    name: Check README file
    runs-on: ubuntu-latest

    steps:
      - name: Check that README.md exists
        run: test -f README.md

      - name: Check that README.md is not empty
        run: test -s README.md
